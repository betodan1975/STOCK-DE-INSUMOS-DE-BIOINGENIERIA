<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alertas de stock</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#f4f6f9;color:#222;padding:16px}
h1{font-size:22px;color:#0f766e;margin-bottom:2px}
.sub{color:#666;font-size:13px;margin-bottom:16px}
.item{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;justify-content:space-between;align-items:center;border-left:5px solid #f59e0b}
.item.critico{border-left-color:#dc2626}
.nombre{font-size:14px;font-weight:600}
.detalle{font-size:12px;color:#777;margin-top:2px}
.stock{font-size:20px;font-weight:800;color:#dc2626;min-width:50px;text-align:right}
.item.bajo .stock{color:#f59e0b}
.badge{font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-left:8px}
.badge.critico{background:#fee2e2;color:#991b1b}
.badge.bajo{background:#fef3c7;color:#92400e}
.vacio{text-align:center;color:#166534;background:#dcfce7;padding:24px;border-radius:10px;font-weight:600}
.err{background:#fee2e2;color:#991b1b;padding:14px;border-radius:8px}
.foot{margin-top:20px;font-size:11px;color:#999;text-align:center}
.count{font-size:13px;color:#666;margin-bottom:12px}
</style>
</head>
<body>
<h1>⚠️ Alertas de stock</h1>
<div class="sub">Insumos en stock bajo o cero — se actualiza en el momento.</div>
<div class="count" id="count"></div>
<div id="contenido">Cargando...</div>
<div class="foot" id="foot"></div>

<script>
const API = window.location.origin;

async function cargar(){
  try{
    const r = await fetch(`${API}/publico/alertas`);
    const data = await r.json();
    const cont = document.getElementById('contenido');
    document.getElementById('count').textContent = `${data.cantidad} insumo${data.cantidad===1?'':'s'} con alerta`;

    if(data.items.length === 0){
      cont.innerHTML = '<div class="vacio">✓ Todo el stock está por encima del mínimo</div>';
    }else{
      cont.innerHTML = data.items.map(i => `
        <div class="item ${i.severidad === 'CRITICO' ? 'critico' : 'bajo'}">
          <div>
            <div class="nombre">${i.nombre} <span class="badge ${i.severidad==='CRITICO'?'critico':'bajo'}">${i.severidad}</span></div>
            <div class="detalle">${i.ubicacion ? 'Ubicación: '+i.ubicacion+' · ' : ''}Mínimo: ${i.stock_minimo}${i.equipo_medico ? ' · '+i.equipo_medico : ''}</div>
          </div>
          <div class="stock">${i.stock}</div>
        </div>
      `).join('');
    }
    const f = new Date(data.actualizado);
    document.getElementById('foot').textContent = 'Actualizado: ' + f.toLocaleString('es-AR');
  }catch(e){
    document.getElementById('contenido').innerHTML = `<div class="err">No se pudo conectar con el servidor. Verificá que la PC esté encendida y conectada al wifi. (${e.message})</div>`;
  }
}
cargar();
setInterval(cargar, 60000); // se refresca sola cada 1 minuto si la dejan abierta
</script>
</body>
</html>
